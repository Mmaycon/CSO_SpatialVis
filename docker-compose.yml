services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: spatial
      POSTGRES_DB: spatialvis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatial -d spatialvis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      CSO_DATA_ROOT: /app/data
      CSO_DATABASE_URL: postgresql+psycopg2://spatial:spatial@db:5432/spatialvis
      CSO_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    volumes:
      # Bind-mount repo data (expression-wide.parquet, cell_metadata, etc.) into the container
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
