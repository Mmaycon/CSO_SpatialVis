# Conda env for scripts/xenium_subset_to_spatialvis.py
#
#   cd /path/to/CSO_SpatialVis
#   conda env create -f scripts/conda-xenium-pipeline.env.yml
#   conda activate cso-xenium-pipeline
#
# If the solver is slow, use: mamba env create -f scripts/conda-xenium-pipeline.env.yml
# If conda fails on your network, use venv + pip instead:
#   python3.11 -m venv .venv && .venv/bin/pip install -r scripts/requirements-xenium-pipeline-standalone.txt
#
name: cso-xenium-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Core stack from conda-forge (no lower-bound pins — avoids strict solver issues)
  - numpy
  - pandas
  - pyarrow
  - shapely
  - pillow
  - h5py
  - scipy
  - tifffile
