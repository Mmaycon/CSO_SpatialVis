# Conda env for scripts/cosmx_to_spatialvis.py
#
#   conda env create -f scripts/conda-cosmx-pipeline.env.yml
#   conda activate cso-cosmx-pipeline
#
name: cso-cosmx-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.0
  - pyarrow>=15
  - scipy>=1.11
  - shapely>=2.0
  - pillow>=10.0
  - zarr>=2.16
  - dask>=2024.1
  - geopandas>=0.14
  - pip:
      - spatialdata>=0.2.5
      - anndata>=0.10
